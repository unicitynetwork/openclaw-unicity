name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # .npmrc sets ignore-scripts=true, so no dependency install scripts run
      # (openclaw's included). The unit tests still import a few
      # openclaw/plugin-sdk runtime helpers, so `npm test` runs some OpenClaw code.
      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      # Lists the packed artifact itself: the shape of `npm pack --json` differs between npm versions.
      - name: Verify packed tarball contains the built entry
        run: |
          TARBALL="$(npm pack --silent)"
          tar -tzf "$TARBALL" | grep -x 'package/dist/index.js' > /dev/null || { echo "dist/index.js missing from $TARBALL" >&2; exit 1; }
