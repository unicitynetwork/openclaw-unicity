name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # .npmrc sets ignore-scripts=true, so no dependency install scripts run
      # (openclaw's included). The unit tests still import a few
      # openclaw/plugin-sdk runtime helpers, so `npm test` runs some OpenClaw code.
      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - name: Verify packed tarball contains the built entry
        run: npm pack --dry-run --json | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const f=JSON.parse(d)[0].files.map(x=>x.path);if(!f.includes("dist/index.js")){console.error("dist/index.js missing from tarball");process.exit(1)}})'
